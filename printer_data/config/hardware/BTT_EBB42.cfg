#sensor_pin: PB0
#min_temp: 10
#max_temp: 270
#max_power: 1.0
#min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##	Try to keep pressure_advance below 1.0
#pressure_advance: 0.05
##	Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040




#####################################################################
# 	Probe
#####################################################################

[probe]
##	Inductive Probe
##	This probe is not used for Z height, only Quad Gantry Leveling
##  NPN and PNP proximity switch types can be set by jumper
#pin: PF1 #M4-STOP
pin: !EBBCan: PB9 #gpio21
x_offset: 0
y_offset: 0
#z_offset: 0
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.01
samples_tolerance_retries: 3

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

#####################################################################
# 	Probe ENDE
#####################################################################



#[fan_generic extruder_partfan]
#pin: EBBCan: PA0
##max_power:
##shutdown_speed:
#cycle_time: 0.02
##hardware_pwm: true
#kick_start_time: 0.3
#off_below: 0.05

[heater_fan HOTEND_FAN]
pin: EBBCan: PA1
heater: extruder
heater_temp: 50.0

[neopixel HOTEND_RGB]
pin: EBBCan:PA3
chain_count: 2
initial_RED: 0.05
initial_GREEN: 0.05
initial_BLUE: 0.05
color_order: GRBW

##	Set RGB values on boot up for each Neopixel. 
##	Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode SETDISPLAYNEOPIXEL]
gcode:
       SET_LED LED=HOTEND_RGB RED=0.2 GREEN=0.3 BLUE=0.4 INDEX=1 TRANSMIT=1
       SET_LED LED=HOTEND_RGB RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
       SET_LED LED=HOTEND_RGB RED=1 GREEN=0 BLUE=0 INDEX=3 TRANSMIT=0

       
