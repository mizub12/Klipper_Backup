[gcode_macro AUTOFOCUS_WEBCAM]
description: Fährt exakt in die Mitte des Bauteils, fokussiert die Webcam und friert den Fokus ein.
gcode:
    # 1. Parameter aus dem Slicer-Übergabebefehl abfangen
    # Falls keine Werte übergeben werden, wird standardmäßig die Bettmitte als Fallback genutzt
    {% set max_x_bed = printer.toolhead.axis_maximum.x | float %}
    {% set max_y_bed = printer.toolhead.axis_maximum.y | float %}
    
    {% set print_min_x = params.PRINT_MIN.split(',')[0] | float if params.PRINT_MIN else 0.0 %}
    {% set print_min_y = params.PRINT_MIN.split(',')[1] | float if params.PRINT_MIN else 0.0 %}
    {% set print_max_x = params.PRINT_MAX.split(',')[0] | float if params.PRINT_MAX else max_x_bed %}
    {% set print_max_y = params.PRINT_MAX.split(',')[1] | float if params.PRINT_MAX else max_y_bed %}

    # 2. Exaktes Zentrum des Druckobjekts berechnen
    {% set center_x = print_min_x + ((print_max_x - print_min_x) / 2.0) %}
    {% set center_y = print_min_y + ((print_max_y - print_min_y) / 2.0) %}

    # 3. Achsen homen, falls noch nicht geschehen
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # 4. Absolut-Koordinaten aktivieren
    G90 

    {action_respond_info("Fahre in die Objekt-Mitte (X: %.2f, Y: %.2f) zum Fokussieren..." % (center_x, center_y))}
    
    # 5. In die Objektmitte fahren (Z auf 50mm Sicherheitsabstand, damit die Cam freie Sicht hat)
    G1 X{center_x} Y{center_y} Z50 F6000 

    # 6. Dein Autofokus-Makro einschalten (Wert 1)
    {action_respond_info("Autofokus wird aktiviert...")}
    AUTOFOCUS_WEBCAM STATE=1  # Falls dein Parameter im Makro anders heißt (z. B. ENABLE=1), hier anpassen!

    # 7. G4 Verweilzeit (5 Sekunden), damit die Kamera die Schärfe anpassen kann
    G4 P5000

    # 8. Dein Autofokus-Makro ausschalten (Wert 0)
    {action_respond_info("Fokus fixiert. Autofokus wird deaktiviert.")}
    AUTOFOCUS_WEBCAM STATE=0  # Falls dein Parameter im Makro anders heißt, hier anpassen!
