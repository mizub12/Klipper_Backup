# ==============================================================================
# PTZ-STEUERUNG & PRESETS FÃœR LOGITECH C920
# ==============================================================================

[gcode_shell_command webcam_ptz]
command: /home/pi/shell_command/WebCam/webcam_ptz.sh
timeout: 2.0
verbose: True

# Variable zum Speichern der aktuellen PTZ-Positionen in Klipper
[gcode_macro _webcam_PTZ_VARS]
variable_zoom: 100
variable_pan: 0
variable_tilt: 0
variable_focus: 0
gcode:

# Zentrales Steuerungs-Makro (aktualisiert Werte & ruft Bash-Skript auf)
[gcode_macro webcam_PTZ_SET]
description: Setzt Zoom, Pan, Tilt und Fokus gleichzeitig
gcode:
    {% set vars = printer["gcode_macro _webcam_PTZ_VARS"] %}
    {% set z = params.ZOOM|default(vars.zoom)|int %}
    {% set p = params.PAN|default(vars.pan)|int %}
    {% set t = params.TILT|default(vars.tilt)|int %}
    {% set f = params.FOCUS|default(vars.focus)|int %}

    # Sicherheitsgrenzen einhalten
    {% set z = [100, [500, z]|min]|max %}
    {% set p = [-36000, [36000, p]|min]|max %}
    {% set t = [-36000, [36000, t]|min]|max %}
    {% set f = [0, [250, f]|min]|max %}

    SET_GCODE_VARIABLE MACRO=_webcam_PTZ_VARS VARIABLE=zoom VALUE={z}
    SET_GCODE_VARIABLE MACRO=_webcam_PTZ_VARS VARIABLE=pan VALUE={p}
    SET_GCODE_VARIABLE MACRO=_webcam_PTZ_VARS VARIABLE=tilt VALUE={t}
    SET_GCODE_VARIABLE MACRO=_webcam_PTZ_VARS VARIABLE=focus VALUE={f}

    RUN_SHELL_COMMAND CMD=webcam_ptz PARAMS="{z} {p} {t} {f}"
    RESPOND MSG="webcam PTZ -> Zoom: {z} | Pan: {p} | Tilt: {t} | Fokus: {f}"

# ------------------------------------------------------------------------------
# SCHRITTWEISE NAVIGATION (Zum bequemen Einrichten in Mainsail)
# ------------------------------------------------------------------------------

[gcode_macro PTZ_ZOOM_IN]
description: Zoomt eine Stufe naeher heran (+50)
gcode:
    {% set z = printer["gcode_macro _webcam_PTZ_VARS"].zoom + 50 %}
    webcam_PTZ_SET ZOOM={z}

[gcode_macro PTZ_ZOOM_OUT]
description: Zoomt eine Stufe heraus (-50)
gcode:
    {% set z = printer["gcode_macro _webcam_PTZ_VARS"].zoom - 50 %}
    webcam_PTZ_SET ZOOM={z}

[gcode_macro PTZ_LINKS]
description: Schwenkt das Bild nach links (Step 3600)
gcode:
    {% set p = printer["gcode_macro _webcam_PTZ_VARS"].pan - 3600 %}
    webcam_PTZ_SET PAN={p}

[gcode_macro PTZ_RECHTS]
description: Schwenkt das Bild nach rechts (Step 3600)
gcode:
    {% set p = printer["gcode_macro _webcam_PTZ_VARS"].pan + 3600 %}
    webcam_PTZ_SET PAN={p}

[gcode_macro PTZ_HOCH]
description: Neigt das Bild nach oben (Step 3600)
gcode:
    {% set t = printer["gcode_macro _webcam_PTZ_VARS"].tilt + 3600 %}
    webcam_PTZ_SET TILT={t}

[gcode_macro PTZ_RUNTER]
description: Neigt das Bild nach unten (Step 3600)
gcode:
    {% set t = printer["gcode_macro _webcam_PTZ_VARS"].tilt - 3600 %}
    webcam_PTZ_SET TILT={t}

# ------------------------------------------------------------------------------
# GESPEICHERTE ANSICHTEN (Presets)
# ------------------------------------------------------------------------------

[gcode_macro PTZ_ANSICHT_GESAMT]
description: Volles Weitwinkel-Bild des gesamten Druckers
gcode:
    webcam_PTZ_SET ZOOM=100 PAN=0 TILT=0 FOCUS=20

[gcode_macro PTZ_ANSICHT_BETT_MITTE]
description: Nahaufnahme auf die Druckbettmitte (First-Layer-Check)
gcode:
    webcam_PTZ_SET ZOOM=250 PAN=0 TILT=-7200 FOCUS=45

[gcode_macro PTZ_ANSICHT_EXTRUDER]
description: Blick nach oben auf Extruder / Filamentzufuhr
gcode:
    webcam_PTZ_SET ZOOM=220 PAN=-10800 TILT=14400 FOCUS=35
