[gcode_macro LOAD_FILAMENT]
gcode:
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=210
    M109 S210
    SET_PIN PIN=LED VALUE=1.00
    M83
    G0 E10 F60
    M83
    G0 E100 F600
    M83
    G0 E100 F600
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=210
    M83
    G0 E100 F300
    M83
    G0 E100 F300
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=210
    M83
    G0 E100 F300
    M83
    G0 E100 F300
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_PIN PIN=LED VALUE=0.00

#---------------------------------------------------------------------------------------------



#---------------------------------------------------------------------------------------------
[gcode_macro UNLOAD_FILAMENT]
gcode:
    M109 S210
    SET_PIN PIN=LED VALUE=1.00
    M83
    G0 E-50 F60
    M83
    G0 E-50 F300
    M83
    G0 E-100 F600
    M83
    G0 E-100 F600
    M83
    G0 E-100 F600
    M83
    G0 E-100 F600
    TURN_OFF_HEATERS
    SET_PIN PIN=LED VALUE=0.00

