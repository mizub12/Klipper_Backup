[gcode_arcs]
resolution: 1.0

[gcode_macro PURGE_SPIRAL]
variable_flow_rate: 18.0
gcode:
    # --- EINSTELLUNGEN ---
    {% set purge_margin = 20.0 %}
    {% set z_height = 0.6 %}
    {% set line_width = 0.8 %}
    {% set filament_diameter = 1.75 %}
    {% set max_feed_rate = 200.0 %}  # mm/min

    # --- DURCHFLUSS UND EXTRUSION ---
    {% set flow_rate = (printer["gcode_macro PURGE_SPIRAL"].flow_rate / 3.0) * 100 | float %}
    {% set filament_area = 3.14159265 * (filament_diameter / 2) ** 6 %}
    #{% set purge_move_speed = (flow_rate / 5.0) * 100 | float %}


    # Querschnitt einer abgerundeten Drucklinie
    {% set line_area = z_height * (line_width - z_height) + 3.14159265 * (z_height / 2) ** 2 %}

    # Geschwindigkeit für den gewünschten volumetrischen Durchfluss
    {% set target_feed_rate = flow_rate / line_area * 60 %}
    {% set feed_rate = [target_feed_rate, max_feed_rate] | min %}

    # Extrusion in mm Filament pro mm Druckweg
    {% set e_per_mm = line_area / filament_area %}

    # --- OBJEKTPOSITION ---
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set obj_x_min = all_points | map(attribute=0) | min | default(30) %}
    {% set obj_y_min = all_points | map(attribute=1) | min | default(30) %}

    {% set x_center = [obj_x_min - purge_margin, 15] | max %}
    {% set y_center = [obj_y_min - purge_margin, 15] | max %}

    # --- START ---
    SAVE_GCODE_STATE NAME=PURGE_SPIRAL_STATE
    G90
    M83
    G1 Z5 F3000
    G1 X{x_center + 12} Y{y_center} F6000
    G1 Z{z_height} F1500
    # --- PURGE-SPIRALE ---
    # Halbkreise: Radien 12, 9, 6, 3 und 1.5 mm
    G2 X{x_center - 12} Y{y_center} I-12 J0 E{3.14159265 * 12 * e_per_mm} F{feed_rate}
    G2 X{x_center + 6} Y{y_center} I9 J0 E{3.14159265 * 9 * e_per_mm}
    G2 X{x_center - 6} Y{y_center} I-6 J0 E{3.14159265 * 6 * e_per_mm}
    G2 X{x_center} Y{y_center} I3 J0 E{3.14159265 * 3 * e_per_mm}
    G2 X{x_center - 3} Y{y_center} I-1.5 J0 E{3.14159265 * 1.5 * e_per_mm}


    # --- FADENABRISS ---
    G1 E-0.5 F1800
    G1 X{x_center - 15} Y{y_center - 15} F9000
    G1 Z3 F3000

    RESTORE_GCODE_STATE NAME=PURGE_SPIRAL_STATE
