[gcode_macro WEBCAM_AUTOFOCUS]
description: Fährt in die Mitte, aktiviert den Autofokus und fixiert ihn nach 5 Sekunden.
gcode:
    # 1. Achsen homen, falls noch nicht geschehen
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # 2. Absolut-Koordinaten aktivieren
    G90 

    # 3. Mitte des Druckbetts automatisch berechnen
    {% set max_x = printer.toolhead.axis_maximum.x | float %}
    {% set max_y = printer.toolhead.axis_maximum.y | float %}
    {% set center_x = max_x / 2.0 %}
    {% set center_y = max_y / 2.0 %}

    {action_respond_info("Fahre in die Bett-Mitte zum Fokussieren...")}
    
    # 4. In die Mitte fahren (Z-Höhe auf 50mm angehoben, damit die Kamera freie Sicht hat)
    G1 X{center_x} Y{center_y} Z50 F6000 

    # 5. Dein Autofokus-Makro mit Parameter 1 (Ein) aufrufen
    {action_respond_info("Autofokus wird aktiviert...")}
    WEBCAM_AUTOFOCUS STATE=1  # Falls dein Parameter anders heißt (z.B. ENABLE=1), hier anpassen

    # 6. G4 Verweilzeit (5000 Millisekunden = 5 Sekunden), damit die Kamera scharf stellen kann
    G4 P5000

    # 7. Dein Autofokus-Makro mit Parameter 0 (Aus) aufrufen
    {action_respond_info("Fokus fixiert. Autofokus wird deaktiviert.")}
    WEBCAM_AUTOFOCUS STATE=0  # Falls dein Parameter anders heißt (z.B. ENABLE=0), hier anpassen
