[gcode_macro G32]
gcode:
   {action_respond_info ("extruder temp = %i" % printer['gcode_macro print_start'].extruder_temp )}
   {action_respond_info ("bed temp = %i" % printer['gcode_macro print_start'].bed_temp )}
   {% set bed_temp = printer['gcode_macro print_start'].bed_temp|default(0)|int %} # print_start'].bed_temp
   {% set extruder_temp = printer['gcode_macro print_start'].extruder_temp|default(0)|int %} # print_start'].extruder_temp
   #{action_respond_info("Parameter: RETRACT:%.2f" % retract_length)} 
   G28              #Referenz fahrt in X,Y und Z
   #G0 X190 Y190 Z50 F3600
   M190 S{bed_temp} #M190 Setzte Bed Temperatur und warte bis Temp erreicht ist.
   M104 S{150}      #M104 Setzte Extruder Temperatur und warte nicht bis Temp erreicht ist.

   ##G28 Z; recalibrate Z now that we are at temp
   QUAD_GANTRY_LEVEL
   G28 Z
   ###	Uncomment for 350mm build
   #G0 X190 Y190 Z30 F3600
#---------------------------------------------------------------------------------------------


#---------------------------------------------------------------------------------------------

[gcode_macro print_start]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
variable_bed_temp:0
variable_extruder_temp:0
gcode:
    #SDCARD_RESET_FILE
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(180)|int %}
    SET_GCODE_VARIABLE MACRO=print_start VARIABLE=bed_temp VALUE={BED_TEMP}                 #Variable wir GOLBAL gepeichert
    SET_GCODE_VARIABLE MACRO=print_start VARIABLE=extruder_temp VALUE={EXTRUDER_TEMP}       #Variable wir GOLBAL gepeichert
    G32
    BED_MESH_CLEAR
    BED_MESH_PROFILE LOAD=default  
    #clean_nozzle     
    #G32                            # home all axes
    #G1 Z20 F3000                   # move nozzle away from bed
    #G28                            # Home all axes
    #G1 X1 Y1 Z1                    # go to center while heating up
    #G32
    #BED_MESH_CALIBRATE PRINT_MIN={params.PRINT_MIN} PRINT_MAX={params.PRINT_MAX} FORCE_NEW_MESH=True    
    # Start bed heating (but don't wait for it)
      #M140 S{BED_TEMP}
    # Use absolute coordinates
       #G90
    #Smart_Park
    #G28 Z; recalibrate Z now that we are at temp
    # Wait for bed to reach temperature
       M190 S{BED_TEMP}          #Set and wait for bed to reach temperature
       M109 S{EXTRUDER_TEMP}     #Set and wait for nozzle to reach temperature
    clean_nozzle 
    status_printing

#---------------------------------------------------------------------------------------------



