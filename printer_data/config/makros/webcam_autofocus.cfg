[gcode_macro AUTOFOCUS_WEBCAM]
description: Aktiviert Autofokus, fährt in die Mitte des Bauteils, wartet und friert den Fokus ein.
gcode:
    # 1. Parameter aus dem Slicer-Übergabebefehl einlesen (Fallback auf Bettmitte, falls leer)
    {% set max_x_bed = printer.toolhead.axis_maximum.x | float %}
    {% set max_y_bed = printer.toolhead.axis_maximum.y | float %}
    
    {% set print_min_x = params.PRINT_MIN.split(',') | float if params.PRINT_MIN else 0.0 %}
    {% set print_min_y = params.PRINT_MIN.split(',') | float if params.PRINT_MIN else 0.0 %}
    {% set print_max_x = params.PRINT_MAX.split(',') | float if params.PRINT_MAX else max_x_bed %}
    {% set print_max_y = params.PRINT_MAX.split(',') | float if params.PRINT_MAX else max_y_bed %}

    # 2. Exaktes Zentrum des Druckobjekts berechnen
    {% set center_x = print_min_x + ((print_max_x - print_min_x) / 2.0) %}
    {% set center_y = print_min_y + ((print_max_y - print_min_y) / 2.0) %}

    # 3. Achsen homen, falls noch nicht geschehen (wichtig vor Fahrbefehlen!)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # 4. Absolut-Koordinaten aktivieren
    G90 

    # 5. JETZT ERST: Autofokus einschalten, damit er auf die Fahrt reagiert
    {action_respond_info("Autofokus AKTIVIERT. Beginne Fahrt zur Scharfstellung...")}
    WEBCAM_AUTOFOCUS FOCUS_AUTOMATIC_CONTINUOUS=1

    # 6. DANN VERFAHREN: In die Objektmitte fahren (Z auf 50mm Sichtabstand)
    {action_respond_info("Fahre in die Objekt-Mitte (X: %.2f, Y: %.2f)..." % (center_x, center_y))}
    G1 X{center_x} Y{center_y} Z50 F6000 

    # 7. DANN WARTEN: G4 Verweilzeit (5 Sekunden) für den finalen Fokus-Check nach der Fahrt
    {action_respond_info("In Position. Warte auf finalen Fokus...")}
    G4 P5000

    # 8. AUTOFOCUS AUS: Fokus fixieren
    {action_respond_info("Fokus fixiert. Autofokus wird DEAKTIVIERT.")}
    WEBCAM_AUTOFOCUS FOCUS_AUTOMATIC_CONTINUOUS=0
