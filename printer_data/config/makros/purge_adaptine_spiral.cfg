[gcode_arcs]
resolution: 1.0

[gcode_macro PURGE_SPIRAL]
gcode:
    # --- EINSTELLUNGEN ---
    {% set purge_margin = 15 %}   ; Abstand der Spirale zum Bauteil (in mm)
    {% set z_height = 0.3 %}       ; Druckhöhe der Purge-Spirale
    {% set feed_rate = 1200 %}     ; Druckgeschwindigkeit (mm/min)
    
    # --- AUTOMATISCHE POSITIONIERUNG (KAMP-LOGIK) ---
    # Wir holen uns alle Eckpunkte des aktuellen Druckobjekts
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    
    # Wir ermitteln die minimale X- und Y-Koordinate (unten links vom Bauteil)
    {% set obj_x_min = all_points | map(attribute=0) | min | default(10) %}
    {% set obj_y_min = all_points | map(attribute=1) | min | default(10) %}
    
    # Der Mittelpunkt der Spirale wird schräg vor die linke Ecke gesetzt
    {% set x_center = obj_x_min - purge_margin %}
    {% set y_center = obj_y_min - purge_margin %}
    
    # SICHERHEITS-CHECK: Verhindern, dass die Spirale außerhalb des Betts (unter 15mm) gedruckt wird
    {% set x_center = [x_center, 15] | max %}
    {% set y_center = [y_center, 15] | max %}

    # --- STARTVORBEREITUNG ---
    G90                            ; Absolute Positionierung
    G1 Z5 F3000                    ; Düse zur Sicherheit anheben
    G1 X{x_center + 12} Y{y_center} F6000 ; Zum Startpunkt fahren (außen rechts der Spirale)
    G1 Z{z_height} F1500           ; Auf Druckhöhe absenken
    G92 E0                         ; Extruder nullen

    # --- DIE ADAPTIVE SPIRALE (Aus G2-Bögen) ---
    # Bogen 1 (Halbkreis oben rum nach links, Radius 12mm)
    G2 X{x_center - 12} Y{y_center} I-12 J0 E5 F{feed_rate}
    
    # Bogen 2 (Halbkreis unten rum nach rechts, Radius 9mm)
    G2 X{x_center + 6} Y{y_center} I9 J0 E4
    
    # Bogen 3 (Halbkreis oben rum nach links, Radius 6mm)
    G2 X{x_center - 6} Y{y_center} I-6 J0 E3
    
    # Bogen 4 (Halbkreis unten rum nach rechts, Radius 3mm)
    G2 X{x_center + 0} Y{y_center} I3 J0 E2
    
    # Bogen 5 (Der finale enge Innenkreis/Kern)
    G2 X{x_center - 3} Y{y_center} I-1.5 J0 E1.5
    
    # --- FADENABRISS (Ruckartiger Ausbruch weg vom Bauteil) ---
    G92 E0                         ; Extruder nullen
    # Wir brechen nach LINKS-UNTEN (X-15, Y-15) aus, also direkt WEG vom Bauteil Richtung Bettecke
    G1 X{x_center - 15} Y{y_center - 15} F9000 
    G1 Z3 F3000                    ; Z-Hop zum sauberen Trennen
    G92 E0                         ; Extruder erneut nullen