# ==============================================================================
# NOZZELCAM STEUERUNG ÜBER V4L2-CTL (Crowsnest / Klipper Shell Command)
# ==============================================================================
# Voraussetzung: Kiauh -> Extensions -> G-Code Shell Command muss installiert sein.

[gcode_shell_command v4l2_set]
command: v4l2-ctl -d /dev/v4l/by-id/usb-WN-220711-ZW_WN_Camera_01.00.00-video-index0 -c
timeout: 2.0
verbose: True

# ------------------------------------------------------------------------------
# BILD-EINSTELLUNGEN (Helligkeit, Kontrast, Sättigung, Schärfe, Gamma, Hue)
# ------------------------------------------------------------------------------

[gcode_macro NOZZEL_CAM_BRIGHTNESS]
description: Helligkeit einstellen (min=-64, max=64, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="brightness={val}"

[gcode_macro NOZZEL_CAM_CONTRAST]
description: Kontrast einstellen (min=0, max=95, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="contrast={val}"

[gcode_macro NOZZEL_CAM_SATURATION]
description: Sättigung einstellen (min=0, max=100, default=64)
gcode:
    {% set val = params.VALUE|default(64)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="saturation={val}"

[gcode_macro NOZZEL_CAM_HUE]
description: Farbton einstellen (min=-2000, max=2000, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="hue={val}"

[gcode_macro NOZZEL_CAM_GAMMA]
description: Gamma einstellen (min=100, max=300, default=100)
gcode:
    {% set val = params.VALUE|default(100)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="gamma={val}"

[gcode_macro NOZZEL_CAM_SHARPNESS]
description: Schärfe einstellen (min=1, max=7, default=2)
gcode:
    {% set val = params.VALUE|default(2)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="sharpness={val}"

[gcode_macro NOZZEL_CAM_BACKLIGHT]
description: Gegenlichtkompensation (0=Aus, 1=An, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="backlight_compensation={val}"

[gcode_macro NOZZEL_CAM_POWER_FREQ]
description: Netzfrequenz Flimmerreduzierung (0=Aus, 1=50Hz, 2=60Hz)
gcode:
    {% set val = params.VALUE|default(1)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="power_line_frequency={val}"

# ------------------------------------------------------------------------------
# WEISSABGLEICH (White Balance)
# ------------------------------------------------------------------------------

[gcode_macro NOZZEL_CAM_WB_AUTO]
description: Automatischer Weissabgleich (0=Manuell, 1=Auto)
gcode:
    {% set val = params.VALUE|default(1)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="white_balance_automatic={val}"

[gcode_macro NOZZEL_CAM_WB_TEMP]
description: Farbtemperatur in Kelvin (min=2800, max=6500 - schaltet WB_AUTO aus)
gcode:
    {% set val = params.VALUE|default(4600)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="white_balance_automatic=0,white_balance_temperature={val}"

# ------------------------------------------------------------------------------
# BELICHTUNG (Exposure)
# ------------------------------------------------------------------------------

[gcode_macro NOZZEL_CAM_EXPOSURE_AUTO]
description: Belichtungsmodus (1=Manuell, 3=Aperture Priority / Auto)
gcode:
    {% set val = params.VALUE|default(3)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="auto_exposure={val}"

[gcode_macro NOZZEL_CAM_EXPOSURE_TIME]
description: Belichtungszeit absolut (min=3, max=2047 - schaltet Auto-Exposure aus)
gcode:
    {% set val = params.VALUE|default(166)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="auto_exposure=1,exposure_time_absolute={val}"

# ------------------------------------------------------------------------------
# FOKUS (Focus)
# ------------------------------------------------------------------------------

[gcode_macro NOZZEL_CAM_FOCUS_AUTO]
description: Autofokus kontinuierlich (0=Aus, 1=An)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="focus_automatic_continuous={val}"

[gcode_macro NOZZEL_CAM_FOCUS_ABS]
description: Manueller Fokus (min=0, max=1023 - schaltet Autofokus aus)
gcode:
    {% set val = params.VALUE|default(200)|int %}
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="focus_automatic_continuous=0,focus_absolute={val}"

# ------------------------------------------------------------------------------
# PRESETS (Gespeicherte Werte aus deinem Log & Standardwerte)
# ------------------------------------------------------------------------------

[gcode_macro NOZZEL_CAM_APPLY_CURRENT_LOG]
description: Setzt exakt die Werte aus deinem Crowsnest-Log
gcode:
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="brightness=64,contrast=0,saturation=64,hue=0,white_balance_automatic=1,gamma=100,power_line_frequency=1,sharpness=3,backlight_compensation=0,auto_exposure=3,focus_automatic_continuous=0,focus_absolute=200"

[gcode_macro NOZZEL_CAM_RESET_DEFAULTS]
description: Setzt alle Kamera-Werte auf Werkseinstellungen zurück
gcode:
    RUN_SHELL_COMMAND CMD=v4l2_set PARAMS="brightness=0,contrast=0,saturation=64,hue=0,white_balance_automatic=1,gamma=100,power_line_frequency=1,sharpness=2,backlight_compensation=0,auto_exposure=3,focus_automatic_continuous=0,focus_absolute=0"


# ------------------------------------------------------------------------------
# AUTOMATISCHER START BEI KLIPPER-BOOT
# ------------------------------------------------------------------------------

[delayed_gcode CAM_INIT_ON_BOOT]
initial_duration: 5.0
gcode:
    CAM_APPLY_CURRENT_LOG


# ------------------------------------------------------------------------------
# AKTUELLE KAMERA-WERTE AUSLESEN
# ------------------------------------------------------------------------------

[gcode_shell_command v4l2_get]
command: v4l2-ctl -d /dev/v4l/by-id/usb-WN-220711-ZW_WN_Camera_01.00.00-video-index0 -L
timeout: 2.0
verbose: True

[gcode_macro CAM_GET_VALUES]
description: Zeigt alle aktuellen Kamera-Einstellungen in der Mainsail-Konsole an
gcode:
    RUN_SHELL_COMMAND CMD=v4l2_get
