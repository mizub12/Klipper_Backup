[gcode_arcs]
resolution: 1.0

[gcode_macro PURGE_SPIRAL]
gcode:
    # --- EINSTELLUNGEN ---
    {% set x_center = 25 %}    ; X-Mittelpunkt der Spirale auf dem Bett
    {% set y_center = 25 %}    ; Y-Mittelpunkt der Spirale auf dem Bett
    {% set z_height = 0.3 %}   ; Druckhöhe der Purge-Spirale
    {% set feed_rate = 1200 %} ; Druckgeschwindigkeit (mm/min)
    
    # --- STARTVORBEREITUNG ---
    G90                        ; Absolute Positionierung
    G1 Z5 F3000                ; Düse zur Sicherheit anheben
    G1 X{x_center + 12} Y{y_center} F6000 ; Zum Startpunkt fahren (ganz außen rechts)
    G1 Z{z_height} F1500       ; Auf Druckhöhe absenken
    G92 E0                     ; Extruder nullen

    # --- DIE SPIRALE (Zusammengesetzt aus G2-Bögen im Uhrzeigersinn) ---
    # Befehlserklärung: X/Y ist der Endpunkt des Halbkreises. 
    # I und J beschreiben RELATIV den Weg vom Startpunkt zum Mittelpunkt dieses Bogens.
    
    # Bogen 1 (Halbkreis oben rum nach links, Radius 12mm)
    G2 X{x_center - 12} Y{y_center} I-12 J0 E5 F{feed_rate}
    
    # Bogen 2 (Halbkreis unten rum nach rechts, Radius verkürzt sich auf 9mm)
    # Der Mittelpunkt verschiebt sich leicht, damit die Linien fließen
    G2 X{x_center + 6} Y{y_center} I9 J0 E4
    
    # Bogen 3 (Halbkreis oben rum nach links, Radius verkürzt sich auf 6mm)
    G2 X{x_center - 6} Y{y_center} I-6 J0 E3
    
    # Bogen 4 (Halbkreis unten rum nach rechts, Radius verkürzt sich auf 3mm)
    G2 X{x_center + 0} Y{y_center} I3 J0 E2
    
    # Bogen 5 (Der finale enge Innenkreis/Kern, um Druck aufzubauen)
    G2 X{x_center - 3} Y{y_center} I-1.5 J0 E1.5
    
    # --- FADENABRISS (Der "Zapfen"-Effekt) ---
    G92 E0                     ; Extruder nullen
    G1 X{x_center} Y{y_center + 15} F9000 ; Schneller, ruckartiger Ausbruch nach oben
    G1 Z3 F3000                ; Z-Hop zum sauberen Trennen
    G92 E0                     ; Extruder erneut nullen
