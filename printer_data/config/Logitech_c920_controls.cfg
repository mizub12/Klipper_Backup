# ------------------------------------------------------------------------------
# G-CODE MAKROS FÜR MAINSAIL (User Controls)
# ------------------------------------------------------------------------------

[gcode_macro Logitech_c920_BRIGHTNESS]
description: Helligkeit (min=0, max=255, step=1, default=128)
gcode:
    {% set val = params.VALUE|default(128)|int %}
    RUN_SHELL_COMMAND CMD=Logitech_c920_brightness PARAMS="{val}"

[gcode_macro Logitech_c920_CONTRAST]
description: Kontrast (min=0, max=255, step=1, default=128)
gcode:
    {% set val = params.VALUE|default(128)|int %}
    RUN_SHELL_COMMAND CMD=c920_contrast PARAMS="{val}"

[gcode_macro Logitech_c920_SATURATION]
description: Sättigung (min=0, max=255, step=1, default=128)
gcode:
    {% set val = params.VALUE|default(128)|int %}
    RUN_SHELL_COMMAND CMD=c920_saturation PARAMS="{val}"

[gcode_macro Logitech_c920_WB_AUTO]
description: Automatischer Weißabgleich (0=Aus, 1=An, default=1)
gcode:
    {% set val = params.VALUE|default(1)|int %}
    RUN_SHELL_COMMAND CMD=c920_white_balance_automatic PARAMS="{val}"

[gcode_macro Logitech_c920_GAIN]
description: Verstärkung / Gain (min=0, max=255, step=1, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=c920_gain PARAMS="{val}"

[gcode_macro Logitech_c920_POWER_FREQ]
description: Netzfrequenz (0=Disabled, 1=50 Hz, 2=60 Hz, default=2)
gcode:
    {% set val = params.VALUE|default(2)|int %}
    RUN_SHELL_COMMAND CMD=c920_power_line_frequency PARAMS="{val}"

[gcode_macro Logitech_c920_WB_TEMP]
description: Farbtemperatur in Kelvin (min=2000, max=6500, step=1, default=4000)
gcode:
    {% set val = params.VALUE|default(4000)|int %}
    RUN_SHELL_COMMAND CMD=c920_white_balance_temperature PARAMS="{val}"

[gcode_macro Logitech_c920_SHARPNESS]
description: Schärfe (min=0, max=255, step=1, default=128)
gcode:
    {% set val = params.VALUE|default(128)|int %}
    RUN_SHELL_COMMAND CMD=c920_sharpness PARAMS="{val}"

[gcode_macro Logitech_c920_BACKLIGHT]
description: Gegenlichtkompensation (min=0, max=1, step=1, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=c920_backlight_compensation PARAMS="{val}"

# ------------------------------------------------------------------------------
# G-CODE MAKROS FÜR MAINSAIL (Camera Controls: Belichtung, Fokus & PTZ)
# ------------------------------------------------------------------------------

[gcode_macro Logitech_c920_EXPOSURE_AUTO]
description: Belichtungsmodus (1=Manual Mode, 3=Aperture Priority, default=3)
gcode:
    {% set val = params.VALUE|default(3)|int %}
    RUN_SHELL_COMMAND CMD=c920_auto_exposure PARAMS="{val}"

[gcode_macro Logitech_c920_EXPOSURE_TIME]
description: Belichtungszeit absolut (min=3, max=2047, step=1, default=250)
gcode:
    {% set val = params.VALUE|default(250)|int %}
    RUN_SHELL_COMMAND CMD=c920_exposure_time_absolute PARAMS="{val}"

[gcode_macro Logitech_c920_EXPOSURE_DYN_FPS]
description: Dynamische Framerate bei Belichtung (0=Aus, 1=An, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=c920_exposure_dynamic_framerate PARAMS="{val}"

[gcode_macro Logitech_c920_PAN]
description: Digitales Schwenken / Pan (min=-36000, max=36000, step=3600, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=c920_pan_absolute PARAMS="{val}"

[gcode_macro Logitech_c920_TILT]
description: Digitales Neigen / Tilt (min=-36000, max=36000, step=3600, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=c920_tilt_absolute PARAMS="{val}"

[gcode_macro Logitech_c920_FOCUS_ABS]
description: Manueller Fokus (min=0, max=250, step=5, default=0)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=c920_focus_absolute PARAMS="{val}"

[gcode_macro Logitech_c920_FOCUS_AUTO]
description: Kontinuierlicher Autofokus (0=Aus, 1=An, default=1)
gcode:
    {% set val = params.VALUE|default(1)|int %}
    RUN_SHELL_COMMAND CMD=c920_focus_automatic_continuous PARAMS="{val}"

[gcode_macro Logitech_c920_ZOOM]
description: Digitaler Zoom (min=100, max=500, step=1, default=100)
gcode:
    {% set val = params.VALUE|default(100)|int %}
    RUN_SHELL_COMMAND CMD=c920_zoom_absolute PARAMS="{val}"


# ------------------------------------------------------------------------------
# SAMMEL-MAKROS (Reset auf Werkseinstellungen & Log-Werte laden)
# ------------------------------------------------------------------------------

[gcode_shell_command Logitech_c920_set_all]
command: /home/pi/shell_command/cam_scripts/c920_set_all.sh
timeout: 3.0
verbose: True

[gcode_macro Logitech_c920_RESET_DEFAULTS]
description: Setzt alle 17 Parameter der C920 auf Werkseinstellungen zurück
gcode:
    RUN_SHELL_COMMAND CMD=c920_set_all PARAMS="default"

[gcode_macro Logitech_c920_LOAD_LOG_VALUES]
description: Lädt exakt die C920-Werte aus deinem letzten Crowsnest-Log
gcode:
    RUN_SHELL_COMMAND CMD=c920_set_all PARAMS="log"
