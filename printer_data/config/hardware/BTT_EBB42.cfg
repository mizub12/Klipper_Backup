# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBBCan]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: fbb6c93c4646

[adxl345]
cs_pin: EBBCan: PB12
spi_software_sclk_pin: EBBCan: PB10
spi_software_mosi_pin: EBBCan: PB11
spi_software_miso_pin: EBBCan: PB2
axes_map: x,y,z

[resonance_tester]
accel_chip_z: adxl345

[extruder]                        #Orbiter 2.0 Klipper Konfiguration
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400             #set your nozzle diameter
filament_diameter: 1.750
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.045           #to be calibrated
pressure_advance_smooth_time: 0.02 #to be calibrated
heater_pin: EBBCan: PB13
sensor_type: MAX31865 #EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA4  #EBBCan: PA3
spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2
rtd_use_50Hz_filter: False
min_temp: 10
max_temp: 300
min_extrude_temp: 170
smooth_time: 0.3
max_extrude_cross_section:10



[tmc2209 extruder]
uart_pin: EBBCan: PA15
interpolate: false
run_current: 0.85 
hold_current: 0.300
sense_resistor: 0.11               #**TMS2209 usually have 0.11 ohm, TMC2660 have 0.051 Ohm and TMC5160 have usually 0.075 ohm.
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4


#####################################################################
# 	Extruder
#####################################################################

#	E0 on Motor8
#[extruder]
#step_pin: PC7
#dir_pin: PC8
#enable_pin: !PD2
