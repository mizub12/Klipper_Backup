[output_pin beeper_pin]
pin: EXP1_1
pwm: true
value: 0
shutdown_value: 0
cycle_time: 0.001




[gcode_macro M300]
description: Enables M300 commands
gcode:
  #use a default 1kHz tone if S is omitted
  {% set S = params.S|default(1000)|int %}
  #use a 10ms duration if P is omitted
  {% set P = params.P|default(10)|int %}
  SET_PIN PIN=beeper_pin VALUE=0.95 CYCLE_TIME={1.0/S if S > 0 else 1}
  G4 P{P}
  SET_PIN PIN=beeper_pin VALUE=0








#####################################################################
# 	Chamber Control
#####################################################################


[heater_generic chamber_heater]
heater_pin:PB10
max_power:1.0
# Orca note: here the temperature sensor should be the sensor you are using for chamber temperature, not the PTC sensor
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin:PF7
control = pid
pid_Kp = 63.418
pid_ki = 0.960
pid_kd = 1244.716
min_temp:0
max_temp:70

[gcode_macro M141]
gcode:
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={params.S|default(0)}

[gcode_macro M191]
gcode:
    {% set s = params.S|float %}
    {% if s == 0 %}
        # If target temperature is 0, do nothing
        M117 Chamber heating cancelled
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={s}
        # Orca: uncomment the following line if you want to use heat bed to assist chamber heating
        # M140 S100
        TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={s-1} MAXIMUM={s+1}
        M117 Chamber at target temperature
    {% endif %}



