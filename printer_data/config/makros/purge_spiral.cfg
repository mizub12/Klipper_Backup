
[gcode_arcs]
resolution: 1.0

[gcode_macro PURGE_SPIRAL]
variable_flow_rate: 18.0
gcode:
    # --- EINSTELLUNGEN ---
    {% set z_height = 0.6 %}
    {% set line_width = 0.8 %}
    {% set filament_diameter = 1.75 %}
    {% set max_feed_rate = 200.0 %}  # mm/min
    {% set spiral_radius = 12.0 %}
    {% set clearance = 2.0 %}       # Sicherheitsabstand zum Objekt

    # --- OFFSETS ---
    {% set x_offset = params.X_OFFSET|default(0.0)|float %}
    {% set y_offset = params.Y_OFFSET|default(-20.0)|float %}

    # --- DRUCKBETTGRENZEN ---
    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}

    # --- DRUCKOBJEKT ---
    {% set all_points = printer.exclude_object.objects
        | map(attribute='polygon') | sum(start=[]) %}

    {% set obj_x_min = all_points|map(attribute=0)|min|default(30)|float %}
    {% set obj_x_max = all_points|map(attribute=0)|max|default(30)|float %}
    {% set obj_y_min = all_points|map(attribute=1)|min|default(30)|float %}
    {% set obj_y_max = all_points|map(attribute=1)|max|default(30)|float %}

    {% set obj_x_center = (obj_x_min + obj_x_max) / 2.0 %}
    {% set obj_y_center = (obj_y_min + obj_y_max) / 2.0 %}

    # --- DURCHFLUSS UND EXTRUSION ---
    {% set flow_rate = (printer["gcode_macro PURGE_SPIRAL"].flow_rate / 3.0) * 100 | float %}
    {% set filament_area = 3.14159265 * (filament_diameter / 2.0) ** 2 %}

    {% set line_area = z_height * (line_width - z_height)
        + 3.14159265 * (z_height / 2.0) ** 2 %}

    {% set target_feed_rate = flow_rate / line_area * 60.0 %}
    {% set feed_rate = [target_feed_rate, max_feed_rate]|min %}
    {% set e_per_mm = line_area / filament_area %}

    # ==================================================
    # POSITION 1: VOR DEM OBJEKT (Y-MIN)
    # ==================================================
    {% set c1x = obj_x_center + x_offset %}
    {% set c1y = obj_y_min + y_offset %}

    {% set c1_bed = (
        c1x >= xmin + 15.0 and c1x <= xmax - spiral_radius
        and c1y >= ymin + 15.0 and c1y <= ymax - spiral_radius
    ) %}

    {% set c1_clear = (
        c1x + spiral_radius + clearance <= obj_x_min
        or c1x - spiral_radius - clearance >= obj_x_max
        or c1y + spiral_radius + clearance <= obj_y_min
        or c1y - spiral_radius - clearance >= obj_y_max
    ) %}

    # ==================================================
    # POSITION 2: LINKS VOM OBJEKT (X-MIN)
    # ==================================================
    {% set c2x = obj_x_min - spiral_radius - clearance %}
    {% set c2y = obj_y_center %}

    {% set c2_bed = (
        c2x >= xmin + 15.0 and c2x <= xmax - spiral_radius
        and c2y >= ymin + 15.0 and c2y <= ymax - spiral_radius
    ) %}

    {% set c2_clear = (
        c2x + spiral_radius + clearance <= obj_x_min
        or c2x - spiral_radius - clearance >= obj_x_max
        or c2y + spiral_radius + clearance <= obj_y_min
        or c2y - spiral_radius - clearance >= obj_y_max
    ) %}

    # ==================================================
    # POSITION 3: RECHTS VOM OBJEKT (X-MAX)
    # ==================================================
    {% set c3x = obj_x_max + spiral_radius + clearance %}
    {% set c3y = obj_y_center %}

    {% set c3_bed = (
        c3x >= xmin + 15.0 and c3x <= xmax - spiral_radius
        and c3y >= ymin + 15.0 and c3y <= ymax - spiral_radius
    ) %}

    {% set c3_clear = (
        c3x + spiral_radius + clearance <= obj_x_min
        or c3x - spiral_radius - clearance >= obj_x_max
        or c3y + spiral_radius + clearance <= obj_y_min
        or c3y - spiral_radius - clearance >= obj_y_max
    ) %}

    # ==================================================
    # POSITION 4: HINTER DEM OBJEKT (Y-MAX)
    # ==================================================
    {% set c4x = obj_x_center + x_offset %}
    {% set c4y = obj_y_max + spiral_radius + clearance %}

    {% set c4_bed = (
        c4x >= xmin + 15.0 and c4x <= xmax - spiral_radius
        and c4y >= ymin + 15.0 and c4y <= ymax - spiral_radius
    ) %}

    {% set c4_clear = (
        c4x + spiral_radius + clearance <= obj_x_min
        or c4x - spiral_radius - clearance >= obj_x_max
        or c4y + spiral_radius + clearance <= obj_y_min
        or c4y - spiral_radius - clearance >= obj_y_max
    ) %}

    # ==================================================
    # POSITION WÄHLEN: Y-MIN > X-MIN > X-MAX > Y-MAX
    # ==================================================
    {% if c1_bed and c1_clear %}
        {% set x_center = c1x %}
        {% set y_center = c1y %}
        {action_respond_info("PURGE_SPIRAL: Position Y-MIN gewählt")}
    {% elif c2_bed and c2_clear %}
        {% set x_center = c2x %}
        {% set y_center = c2y %}
        {action_respond_info("PURGE_SPIRAL: Ausweichposition X-MIN gewählt")}
    {% elif c3_bed and c3_clear %}
        {% set x_center = c3x %}
        {% set y_center = c3y %}
        {action_respond_info("PURGE_SPIRAL: Ausweichposition X-MAX gewählt")}
    {% elif c4_bed and c4_clear %}
        {% set x_center = c4x %}
        {% set y_center = c4y %}
        {action_respond_info("PURGE_SPIRAL: Ausweichposition Y-MAX gewählt")}
    {% else %}
        {action_raise_error("PURGE_SPIRAL ABGEBROCHEN: Kein sicherer Platz für die Purge-Spirale gefunden!")}
    {% endif %}

    # --- START ---
    SAVE_GCODE_STATE NAME=PURGE_SPIRAL_STATE
    G90
    M83
    G1 Z5 F3000
    G1 X{x_center + 12} Y{y_center} F6000
    G1 Z{z_height} F1500

    # --- PURGE-SPIRALE ---
    G2 X{x_center - 12} Y{y_center} I-12 J0 E{3.14159265 * 12 * e_per_mm} F{feed_rate}
    G2 X{x_center + 6} Y{y_center} I9 J0 E{3.14159265 * 9 * e_per_mm}
    G2 X{x_center - 6} Y{y_center} I-6 J0 E{3.14159265 * 6 * e_per_mm}
    G2 X{x_center} Y{y_center} I3 J0 E{3.14159265 * 3 * e_per_mm}
    G2 X{x_center - 3} Y{y_center} I-1.5 J0 E{3.14159265 * 1.5 * e_per_mm}

    # --- FADENABRISS ---
    G1 E-0.5 F1800
    G1 X{x_center - 15} Y{y_center - 15} F9000
    G1 Z3 F3000

    RESTORE_GCODE_STATE NAME=PURGE_SPIRAL_STATE
